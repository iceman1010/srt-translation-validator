name: Build PHAR & Create Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.VERSION }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare VERSION against latest release tag
        id: check
        run: |
          git fetch --tags --force
          VERSION=$(tr -d ' \t\n\r' < VERSION)
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "v$VERSION" = "$LATEST" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION unchanged (latest tag: ${LATEST:-none}) - skipping PHAR build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed: ${LATEST:-none} -> v$VERSION - PHAR will be built and released."
          fi

  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '8.1', '8.2', '8.3' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit (self-contained CLI tests always run; example-based tests skip if fixtures absent)
        run: vendor/bin/phpunit tests/

  build-phar:
    name: Build PHAR & Release
    needs: [check-version, tests]
    # Only build when VERSION moved past the latest released tag.
    # workflow_dispatch is the explicit force-rebuild escape hatch.
    if: >-
      (github.event_name != 'pull_request'
        && needs.check-version.outputs.changed == 'true')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build PHAR
        run: php -d phar.readonly=0 build/build-phar.php

      - name: Verify PHAR version
        run: php build/srt-translation-validator.phar --version

      - name: Verify PHAR integrity
        run: |
          php -r '$p = new Phar("build/srt-translation-validator.phar"); echo "Signature: " . $p->getSignature()["hash_type"] . "\n";'

      - name: Create Release & Upload PHAR
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: srt-translation-validator v${{ needs.check-version.outputs.version }}
          body: |
            srt-translation-validator v${{ needs.check-version.outputs.version }}

            ### Installation
            Download the `srt-translation-validator.phar` file and make it executable:
            ```bash
            chmod +x srt-translation-validator.phar
            sudo mv srt-translation-validator.phar /usr/local/bin/srt-translation-validator
            ```

            ### Usage
            ```bash
            srt-translation-validator original.srt translation.srt --lang=de
            ```

            ### How to bump the version
            Edit the `VERSION` file (e.g. `1.0.0` -> `1.0.1`) and push to `main`.
            The workflow rebuilds the PHAR and creates/updates this release.

            ### Changes
            See commit history: https://github.com/${{ github.repository }}/commits/main
          files: build/srt-translation-validator.phar
          draft: false
          prerelease: false

      - name: Upload PHAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: srt-translation-validator.phar
          path: build/srt-translation-validator.phar